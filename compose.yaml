# Local development stack.
# The `web` service uses Django's development server (runserver).
# That is intentional for local work only — do not use runserver in production.

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ubezpieczenia}
      POSTGRES_USER: ${POSTGRES_USER:-ubezpieczenia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ubezpieczenia_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PUBLISH_PORT:-5433}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-ubezpieczenia} -d ${POSTGRES_DB:-ubezpieczenia}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  web:
    build: .
    command: uv run python manage.py runserver 0.0.0.0:8000
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - app_venv:/app/.venv
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  app_venv:
