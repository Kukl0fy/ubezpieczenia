name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: ubezpieczenia_test
          POSTGRES_USER: ubezpieczenia
          POSTGRES_PASSWORD: ci_test_password_not_for_production
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ubezpieczenia -d ubezpieczenia_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SECRET_KEY: ci-test-secret-key-not-for-production
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      POSTGRES_DB: ubezpieczenia_test
      POSTGRES_USER: ubezpieczenia
      POSTGRES_PASSWORD: ci_test_password_not_for_production
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.9"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Check for missing migrations
        run: uv run python manage.py makemigrations --check --dry-run

      - name: Run Ruff
        run: uv run ruff check .

      - name: Run tests
        run: uv run pytest
