<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Ubezpieczenia{% endblock %}</title>
  <style>
    :root {
      --bg: #f4f6f8;
      --surface: #ffffff;
      --text: #1f2933;
      --muted: #52606d;
      --border: #d9e2ec;
      --accent: #243b53;
      --danger: #9b1c1c;
      --focus: #486581;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    a { color: var(--accent); }
    .wrap {
      max-width: 42rem;
      margin: 0 auto;
      padding: 1.5rem 1rem 3rem;
    }
    .wrap--wide {
      max-width: 64rem;
    }
    header.app-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.5rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
    }
    header.app-header h1 {
      margin: 0;
      font-size: 1.25rem;
    }
    .muted { color: var(--muted); }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      padding: 1.25rem;
      margin-bottom: 1rem;
    }
    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1rem;
      flex-wrap: wrap;
      margin-bottom: 1rem;
    }
    .page-header h2,
    .card h2,
    .card h3 {
      margin-top: 0;
    }
    .breadcrumb {
      margin: 0 0 1rem;
    }
    .breadcrumb a {
      font-weight: 600;
    }
    .filters__grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(12rem, 1fr));
      gap: 0.75rem 1rem;
    }
    .filters__grid p {
      margin: 0;
    }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 0.35rem;
    }
    input[type="text"],
    input[type="password"],
    input[type="email"],
    input[type="search"],
    select,
    textarea {
      width: 100%;
      padding: 0.6rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: 0.35rem;
      font: inherit;
      margin-bottom: 1rem;
      background: #fff;
    }
    input:focus,
    select:focus,
    textarea:focus,
    button:focus,
    .button:focus {
      outline: 2px solid var(--focus);
      outline-offset: 1px;
    }
    button,
    .button {
      display: inline-block;
      border: 0;
      border-radius: 0.35rem;
      background: var(--accent);
      color: #fff;
      font: inherit;
      font-weight: 600;
      padding: 0.55rem 1rem;
      cursor: pointer;
      text-decoration: none;
    }
    .button--secondary {
      background: #627d98;
    }
    .button--danger,
    button.button--danger {
      background: var(--danger);
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
    }
    .table-wrap {
      overflow-x: auto;
      padding: 0;
    }
    .data-table {
      width: 100%;
      border-collapse: collapse;
    }
    .data-table th,
    .data-table td {
      text-align: left;
      padding: 0.75rem 1rem;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
    }
    .data-table th {
      font-size: 0.9rem;
      color: var(--muted);
    }
    .badge {
      display: inline-block;
      padding: 0.15rem 0.5rem;
      border-radius: 0.25rem;
      background: #d9e2ec;
      font-size: 0.85rem;
      font-weight: 600;
    }
    .badge--muted {
      background: #f0f4f8;
      color: var(--muted);
    }
    .pagination {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
      margin: 1rem 0;
    }
    .detail-list {
      margin: 0;
      display: grid;
      gap: 0.85rem;
    }
    .detail-list dt {
      font-weight: 600;
      color: var(--muted);
      font-size: 0.9rem;
    }
    .detail-list dd {
      margin: 0.15rem 0 0;
    }
    .confirm-box--danger {
      border-color: #f5c2c2;
    }
    .empty-state p:last-child {
      margin-bottom: 0;
    }
    .errorlist {
      list-style: none;
      margin: 0 0 1rem;
      padding: 0.75rem 1rem;
      background: #fff5f5;
      border: 1px solid #f5c2c2;
      border-radius: 0.35rem;
      color: var(--danger);
    }
    .messages {
      list-style: none;
      margin: 0 0 1rem;
      padding: 0;
    }
    .messages li {
      margin-bottom: 0.5rem;
      padding: 0.75rem 1rem;
      border-radius: 0.35rem;
      background: #e3f8ff;
      border: 1px solid #becfe0;
    }
    @media (max-width: 40rem) {
      .page-header {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
    <div class="wrap {% block wrap_modifier %}{% endblock %}">
    <header class="app-header">
      <h1>Ubezpieczenia</h1>
      {% if user.is_authenticated %}
        <form method="post" action="{% url 'logout' %}">
          {% csrf_token %}
          <button type="submit">Wyloguj</button>
        </form>
      {% endif %}
    </header>

    {% if messages %}
      <ul class="messages">
        {% for message in messages %}
          <li>{{ message }}</li>
        {% endfor %}
      </ul>
    {% endif %}

    {% block content %}{% endblock %}
  </div>
</body>
</html>
